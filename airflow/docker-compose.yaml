# Local Airflow (LocalExecutor - no Celery/Redis needed for a single-machine
# scraping pipeline like this one). The same file is meant to run unchanged
# on a server later: everything environment-specific lives in .env.
#
# Airflow's own metadata DB below is a throwaway local Postgres container -
# it is NOT the app database. The app's Postgres (DigitalOcean-hosted) is
# reached over the network, via DATABASE_URL in the bind-mounted
# ../backend/.env (see the airflow-common volumes/comment below).

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "60"
    # No DATABASE_URL/DB_SCHEMA here on purpose: backend/database/models.py
    # already load_dotenv()s ../backend/.env relative to its own file, and
    # that same .env is bind-mounted in below - one source of truth, and it
    # stays in sync automatically if you edit backend/.env.
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    # Only backend/ and scrapers/ are mounted (not the whole repo) so
    # frontend/node_modules etc. don't get dragged into Docker Desktop's
    # file-sharing layer. Layout under /opt/airflow/project mirrors the repo
    # root so backend/database/seed.py's own sys.path.insert(repo root)
    # resolves the same way it does when run natively.
    - ../backend:/opt/airflow/project/backend
    - ../scrapers:/opt/airflow/project/scrapers
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-metadata-db:
      condition: service_healthy

services:
  airflow-metadata-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-metadata-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" --firstname Admin --lastname User --role Admin --email admin@example.com || true
    depends_on:
      <<: *airflow-common-depends-on

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    entrypoint: ["/opt/airflow/xvfb-entrypoint.sh"]
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-metadata-db-volume:
